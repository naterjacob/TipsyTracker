name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "packages/frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      # VITE_* vars are compiled into the static bundle at build time.
      # VITE_CLERK_PUBLISHABLE_KEY is a publishable (client-safe) key.
      # VITE_API_BASE_URL is "/api" so the SPA calls the same-origin backend
      # served at tipsytracker.org/api/* (no CORS, no hardcoded host).
      - name: Build
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api' }}

      - name: Deploy
        run: npx wrangler deploy
